[project]
name = "subscription-saas-fastapi"
version = "0.1.0"
description = "Subscription-based SaaS backend test task built with FastAPI, PostgreSQL, SQLAlchemy async, and Stripe Checkout."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.2",
    "argon2-cffi>=23.1.0",
    "asyncpg>=0.29.0",
    "email-validator>=2.2.0",
    "fastapi>=0.111.0",
    "greenlet>=3.0.3",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "pydantic-settings>=2.3.4",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.31",
    "stripe>=9.12.0",
    "structlog>=24.2.0",
    "uvicorn[standard]>=0.30.1",
]

[project.optional-dependencies]
test = [
    "aiosqlite>=0.20.0",
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "alembic*"]

[tool.ruff]
line-length = 100
target-version = "py311"
