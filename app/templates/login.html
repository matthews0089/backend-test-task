{% extends "base.html" %}
{% block content %}
<section class="panel">
  <h1>Login</h1>
  <p>Enter your account to purchase and manage subscriptions.</p>
  {% if error %}
  <p class="alert">{{ error }}</p>
  {% endif %}
  <form method="post">
    <input type="hidden" name="next" value="{{ next_url }}">
    <label>Email<br><input name="email" type="email" autocomplete="email" value="{{ email or '' }}" required></label><br>
    <label>Password<br><input name="password" type="password" autocomplete="current-password" required></label><br>
    <button type="submit">Login</button>
  </form>
  <p class="muted">New here? <a href="/register?next={{ next_url }}">Create an account</a>.</p>
</section>
{% endblock %}
