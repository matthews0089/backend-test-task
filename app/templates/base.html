<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subscription SaaS</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #172033;
      --muted: #617085;
      --line: #dce2ea;
      --accent: #2557d6;
      --accent-strong: #183a96;
      --accent-soft: #eef3ff;
      --success-bg: #edf8f0;
      --success-line: #9ccfa8;
      --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    .shell { max-width: 1120px; margin: 0 auto; padding: 28px 20px 56px; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 32px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }
    .brand { color: var(--text); font-weight: 750; text-decoration: none; }
    nav { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    nav a, .link-button {
      color: var(--muted);
      background: transparent;
      border: 0;
      padding: 8px 10px;
      font: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    nav a:hover, .link-button:hover { color: var(--text); }
    h1 { margin: 0 0 10px; font-size: clamp(30px, 4vw, 44px); line-height: 1.08; }
    h2 { margin: 0 0 10px; font-size: 22px; }
    p { color: var(--muted); }
    .hero {
      padding: 34px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(23, 32, 51, 0.06);
    }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 22px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .pricing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px; }
    .plan, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 8px 22px rgba(23, 32, 51, 0.04);
    }
    .plan { display: grid; gap: 16px; align-content: start; min-height: 230px; }
    .plan.current { border-color: var(--success-line); box-shadow: 0 10px 26px rgba(39, 91, 50, 0.09); }
    .plan:hover { border-color: #c7d2e4; box-shadow: 0 12px 30px rgba(23, 32, 51, 0.08); }
    .plan-title { display: grid; gap: 8px; }
    .plan-title h2 { margin: 0; }
    .plan-meta { color: var(--muted); margin: 0; min-height: 48px; }
    .muted { color: var(--muted); }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 13px;
    }
    .badge.success { border-color: var(--success-line); background: var(--success-bg); color: #275b32; }
    .badge.danger { border-color: #f0b8b2; background: #fff4f2; color: var(--danger); }
    .panel-heading {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .success-hero {
      display: grid;
      justify-items: center;
      gap: 14px;
      text-align: center;
      padding: 42px 28px;
    }
    .checkmark {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--success-bg);
      border: 2px solid var(--success-line);
      color: #275b32;
      font-size: 48px;
      font-weight: 800;
      line-height: 1;
    }
    .subscription-layout { display: grid; gap: 28px; }
    .summary-card { padding: 28px; }
    .summary-plan { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .empty-state {
      display: grid;
      justify-items: start;
      gap: 12px;
      padding: 34px;
      background: linear-gradient(180deg, #fff, var(--accent-soft));
    }
    .empty-state h1 { max-width: 560px; }
    .empty-state p { max-width: 620px; margin-top: 0; }
    .empty-icon {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #fff;
      border: 1px solid #c9d7ff;
      color: var(--accent);
      font-size: 38px;
      font-weight: 650;
      line-height: 1;
    }
    .section-row {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: end;
      flex-wrap: wrap;
    }
    input, select {
      width: min(100%, 360px);
      padding: 10px 12px;
      margin: 6px 0 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      font: inherit;
    }
    button, .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 9px 14px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 650;
      text-decoration: none;
      cursor: pointer;
    }
    button:hover, .button:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
    button:disabled { background: #eef1f5; border-color: var(--line); color: var(--muted); cursor: not-allowed; }
    .button.secondary, button.secondary { background: #fff; color: var(--text); border-color: var(--line); }
    .button.secondary:hover, button.secondary:hover { background: #f1f4f8; border-color: #c9d2de; }
    .button.danger, button.danger { background: #fff; color: var(--danger); border-color: #f0b8b2; }
    .button.danger:hover, button.danger:hover { background: #fff4f2; border-color: #e89b93; }
    form { margin: 0; }
    .stack { display: grid; gap: 14px; }
    .notice { border: 1px solid var(--success-line); background: var(--success-bg); padding: 12px; border-radius: 6px; color: #275b32; }
    .alert { border: 1px solid #f0b8b2; background: #fff4f2; padding: 12px; border-radius: 6px; color: var(--danger); }
    .kv { display: grid; grid-template-columns: 180px 1fr; gap: 8px 14px; margin: 18px 0; }
    .kv dt { color: var(--muted); }
    .kv dd { margin: 0; }
    .section-heading { margin-top: 0; }
    @media (max-width: 640px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      .hero { padding: 24px; }
      .kv { grid-template-columns: 1fr; gap: 2px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="/">Subscription SaaS</a>
      <nav>
        <a href="/plans">Plans</a>
        {% if user %}
          <a href="/subscription">Cabinet</a>
          <span class="badge">{{ user.email }}</span>
          <form action="/logout" method="post">
            <button class="link-button" type="submit">Logout</button>
          </form>
        {% else %}
          <a href="/login">Login</a>
          <a class="button secondary" href="/register">Register</a>
        {% endif %}
      </nav>
    </header>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
